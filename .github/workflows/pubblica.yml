# Ad ogni modifica su main:
#  - pubblica la versione web (per iPhone e browser) su GitHub Pages
#  - prepara l'app Android (APK) da scaricare dalla pagina "Actions"
name: Pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk lista-spesa.apk
      # L'APK compare in "Rilasci" nella pagina del repository: da lì si
      # scarica e si installa direttamente dal telefono.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: App Android
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Scarica **lista-spesa.apk** qui sotto dal telefono Android e aprilo per installarlo.
            (Android chiederà di consentire l'installazione da questa fonte: è normale.)

            Su iPhone non serve: apri https://salvatorefiumesas-bit.github.io/lista-spesa.web.app/ con Safari
            e scegli Condividi → Aggiungi alla schermata Home.
          files: lista-spesa.apk
